[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-effects"
version = "0.1.0"
description = "Subject-aware short-form video effects: person segmentation + layered compositing (24 effects: vertigo, paper cut, spotlight, backdrop words, glass card and more)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "opencv-contrib-python-headless>=4.9",
  "mediapipe>=0.10",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fx = "fx.__main__:main"

[tool.setuptools]
packages = ["fx", "fx.effects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
