# Catalog entry for CFW Studio (MIT).
# Implementation: fx effect "grid_collage" in the effects library (MIT).
# See ../README.md (License).
id: e-grid-collage
kind: effect
variation: default
fx_name: grid_collage
label: "Grid collage"
summary: "Tiles many clips in one grid with per-tile labels and a title."

inputs:
  - id: clip
    type: video
    required: true
    cardinality: one
    description: Vertical video this effect is applied to. Optional --start and --end (seconds) limit the window; other frames pass through and audio is kept.
  - id: params
    type: json
    required: false
    cardinality: one
    description: Optional effect parameters. Defaults and the sample params are in SKILL.md.
  - id: palette
    type: text
    required: false
    cardinality: one
    description: Preset name (neutral-mono or navy-amber), a path to palette JSON, or inline palette JSON.

  - id: clips
    type: video
    required: false
    cardinality: many
    description: Optional extra videos. Paths go in params.clips. Omit them to reuse delayed copies of clip.

outputs:
  - id: treated_clip
    type: video
    cardinality: one
    description: The clip with this effect applied.

needs:
  tools:
    - python3
    - ffmpeg
    - ffprobe
  providers: []
