# Catalog entry for CFW Studio (MIT).
# Implementation: fx effect "chat_window" in the effects library (MIT).
# See ../README.md (License).
id: e-chat-window
kind: effect
variation: default
fx_name: chat_window
label: "Chat window"
summary: "The clip plays inside a generic chat window with an avatar, a title, timed bubbles, and typing dots."

inputs:
  - id: clip
    type: video
    required: true
    cardinality: one
    description: Vertical video this effect is applied to. Optional --start and --end (seconds) limit the window; other frames pass through and audio is kept.
  - id: params
    type: json
    required: false
    cardinality: one
    description: Optional effect parameters. Defaults and the sample params are in SKILL.md.
  - id: palette
    type: text
    required: false
    cardinality: one
    description: Preset name (neutral-mono or vasanth-personal), a path to palette JSON, or inline palette JSON.

outputs:
  - id: treated_clip
    type: video
    cardinality: one
    description: The clip with this effect applied.

needs:
  tools:
    - python3
    - ffmpeg
    - ffprobe
  providers: []
