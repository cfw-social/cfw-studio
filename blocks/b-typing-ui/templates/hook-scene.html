<!--
  b-typing-ui: hook card template (an eyebrow, up to three big lines and a subhead).
  Fill it with scripts/hook_fill.py. Do not edit placeholders by hand.
  Needs gsap.min.js beside the filled page (fetched by the b-hyperframes block).
  Fonts Oswald, JetBrains Mono and Inter are expected to be installed (SIL Open Font Licence).
  Nothing here loads from the network.
-->
<template id="hook-scene-template">
<div
  id="hook-scene-root"
  data-composition-id="hook-scene"
  data-start="0"
  data-duration="{{DURATION}}"
  data-width="1080"
  data-height="1920"
>
  <style>
    @font-face { font-family: "Oswald"; src: local("Oswald"); }
    @font-face { font-family: "JetBrains Mono"; src: local("JetBrains Mono"); }
    @font-face { font-family: "Inter"; src: local("Inter"); }

    #hook-scene-root {
      --bg-navy:    #{{BG}};
      --accent:     #{{ACCENT}};
      --coral:      #{{ACCENT}};
      --text-white: #{{FG}};
      --text-muted: color-mix(in srgb, var(--text-white) 65%, var(--bg-navy));
      --text-dim:   color-mix(in srgb, var(--text-white) 55%, var(--bg-navy));

      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg-navy);
      font-family: 'Oswald', sans-serif;
    }

    /* Background radial glow (accent-coloured, breathing) */
    #hook-scene-root .hs-glow {
      position: absolute;
      left: 50%; top: 55%;
      width: 1400px; height: 1400px;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--accent) 18%, transparent) 0%,
        transparent 58%
      );
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Subtle grid */
    #hook-scene-root .hs-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(color-mix(in srgb, var(--text-white) 4%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--text-white) 4%, transparent) 1px, transparent 1px);
      background-size: 120px 120px;
    }

    /* Top eyebrow label */
    #hook-scene-root .hs-eyebrow {
      position: absolute;
      top: 200px;
      width: 100%;
      text-align: center;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    /* Title stack */
    #hook-scene-root .hs-title-stack {
      position: absolute;
      top: 460px;
      width: 100%;
      text-align: center;
      padding: 0 50px;
      box-sizing: border-box;
      will-change: transform;
    }
    #hook-scene-root .hs-line {
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 118px;
      line-height: 0.95;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      will-change: transform, opacity;
      display: block;
    }
    #hook-scene-root .hs-line-white  { color: var(--text-white); }
    #hook-scene-root .hs-line-accent {
      color: var(--accent);
      text-shadow: 0 0 32px color-mix(in srgb, var(--accent) 50%, transparent);
    }

    /* Subheading */
    #hook-scene-root .hs-subhead {
      position: absolute;
      top: 1060px;
      width: 100%;
      text-align: center;
      padding: 0 60px;
      box-sizing: border-box;
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      will-change: transform, opacity;
    }
  </style>

  <div class="hs-grid"></div>
  <div class="hs-glow" id="hs-glow"></div>

  <div class="hs-eyebrow" id="hs-eyebrow">{{EYEBROW}}</div>

  <div class="hs-title-stack" id="hs-title-stack">
    <span class="hs-line hs-line-white" id="hs-line1">{{LINE1}}</span>
    <div style="height:10px"></div>
    <span class="hs-line hs-line-accent" id="hs-line2">{{LINE2}}</span>
    <div style="height:6px"></div>
    <span class="hs-line hs-line-accent" id="hs-line3">{{LINE3}}</span>
  </div>

  <div class="hs-subhead" id="hs-subhead">{{SUBHEAD}}</div>

  <script src="gsap.min.js"></script>
  <script>
  (function () {
    window.__timelines = window.__timelines || {};

    var DURATION = parseFloat("{{DURATION}}");

    /* Optional lines are hidden when empty. The text is read from the page, never from a script string. */
    function present(id) {
      var el = document.getElementById(id);
      var has = !!el && el.textContent.trim() !== "";
      if (el && !has) el.style.display = "none";
      return has;
    }
    var hasLine2 = present("hs-line2");
    var hasLine3 = present("hs-line3");
    var hasSub = present("hs-subhead");

    var tl = gsap.timeline({ paused: true });

    /* The glow breathes over the whole clip. */
    tl.fromTo("#hs-glow", { scale: 0.92, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: DURATION, ease: "sine.inOut" }, 0);

    /* Slow pulse on the title stack: one cycle per second at most. */
    var pulseCycles = Math.max(1, Math.ceil(DURATION));
    tl.fromTo("#hs-title-stack", { scale: 0.98 },
      { scale: 1.02, duration: DURATION / pulseCycles, ease: "sine.inOut", repeat: pulseCycles - 1, yoyo: true }, 0);

    tl.fromTo("#hs-eyebrow", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1);
    tl.fromTo("#hs-line1", { y: 22, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.2);
    if (hasLine2) tl.fromTo("#hs-line2", { y: 22, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.37);
    if (hasLine3) tl.fromTo("#hs-line3", { y: 22, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.52);
    if (hasSub) tl.fromTo("#hs-subhead", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.65);

    window.__timelines["hook-scene"] = tl;
  })();
  </script>
</div>
</template>
