<!--
  b-typing-ui: typing card template (a chat-style card that types a prompt).
  Fill it with scripts/typing_fill.py. Do not edit placeholders by hand.
  Needs gsap.min.js beside the filled page (fetched by the b-hyperframes block).
  Fonts Inter and JetBrains Mono are expected to be installed (SIL Open Font Licence).
  Nothing here loads from the network.
-->
<template id="typing-scene-template">
<div
  id="typing-scene-root"
  data-composition-id="typing-scene"
  data-start="0"
  data-duration="{{DURATION}}"
  data-width="1080"
  data-height="1920"
>
  <style>
    @font-face { font-family: "Inter"; src: local("Inter"); }
    @font-face { font-family: "JetBrains Mono"; src: local("JetBrains Mono"); }

    #typing-scene-root {
      --bg-navy:       #{{BG}};
      --bg-card:       color-mix(in srgb, var(--bg-navy) 80%, #000000);
      --bg-card-hdr:   color-mix(in srgb, var(--bg-navy) 96%, #ffffff);
      --bg-card-bdr:   color-mix(in srgb, var(--bg-navy) 82%, #ffffff);
      --bg-bubble:     color-mix(in srgb, var(--bg-navy) 96%, #ffffff);
      --accent:        #{{ACCENT}};
      --violet:        #8B5CF6;
      --text-white:    #{{FG}};
      --text-muted:    color-mix(in srgb, var(--text-white) 65%, var(--bg-navy));
      --text-dim:      color-mix(in srgb, var(--text-white) 55%, var(--bg-navy));

      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg-navy);
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Radial glow behind the card */
    #typing-scene-root .ts-glow {
      position: absolute;
      left: 50%; top: 42%;
      width: 1200px; height: 1200px;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--accent) 14%, transparent) 0%,
        transparent 60%
      );
      pointer-events: none;
      will-change: opacity;
    }

    /* Instruction label (above the card) */
    #typing-scene-root .ts-label {
      position: absolute;
      top: 100px;
      width: 100%;
      text-align: center;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    /* The main chat card */
    #typing-scene-root .ts-card {
      position: absolute;
      top: 200px;
      left: 50px;
      right: 50px;
      background: var(--bg-card);
      border: 2px solid var(--bg-card-bdr);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      will-change: transform, opacity;
    }

    /* PIP-safe variant: move card up so all content is in top 54% of frame */
    #typing-scene-root.ts-pip-safe .ts-card {
      top: 130px;
    }
    #typing-scene-root.ts-pip-safe .ts-label {
      top: 60px;
      font-size: 24px;
    }
    #typing-scene-root.ts-pip-safe .ts-bottom-tag {
      bottom: auto;
      top: 980px; /* still above PIP zone at 1040 */
    }

    /* Title bar: [mark] label ... new chat */
    #typing-scene-root .ts-titlebar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      background: var(--bg-card-hdr);
      border-bottom: 1px solid var(--bg-card-bdr);
    }
    #typing-scene-root .ts-logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--violet), var(--accent));
      display: flex; align-items: center; justify-content: center;
      color: var(--text-white);
      font-size: 18px; font-weight: 900;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }
    #typing-scene-root .ts-app-name {
      color: var(--text-white);
      font-size: 28px; font-weight: 800;
      letter-spacing: -0.5px;
      font-family: 'Inter', sans-serif;
    }
    #typing-scene-root .ts-new-chat {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 20px; font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    /* User bubble header */
    #typing-scene-root .ts-body {
      padding: 28px 28px 34px;
    }
    #typing-scene-root .ts-user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    #typing-scene-root .ts-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #06B6D4;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900;
      color: var(--bg-navy);
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }
    #typing-scene-root .ts-username {
      color: var(--text-muted);
      font-size: 22px; font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    /* Prompt bubble */
    #typing-scene-root .ts-bubble {
      padding: 28px 30px;
      background: var(--bg-bubble);
      border: 1px solid var(--bg-card-bdr);
      border-radius: 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: {{PROMPT_SIZE}}px;
      color: var(--text-white);
      line-height: 1.45;
      letter-spacing: -0.5px;
      min-height: 440px;
      max-height: {{BUBBLE_MAX}}px;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* PIP-safe: a shorter box, so all content stays in the top half */
    #typing-scene-root.ts-pip-safe .ts-bubble {
      min-height: 300px;
    }

    /* Cursor */
    #typing-scene-root .ts-cursor {
      display: inline-block;
      color: var(--violet);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1em;
      will-change: opacity;
    }

    /* Bottom tag */
    #typing-scene-root .ts-bottom-tag {
      position: absolute;
      bottom: 80px;
      width: 100%;
      text-align: center;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      will-change: opacity;
    }
  </style>

  <!-- background glow -->
  <div class="ts-glow" id="ts-glow"></div>

  <!-- Instruction label above the card -->
  <div class="ts-label" id="ts-label">{{CARD_LABEL}}</div>

  <!-- Main card -->
  <div class="ts-card" id="ts-card">
    <!-- Title bar -->
    <div class="ts-titlebar">
      <div class="ts-logo">AI</div>
      <div class="ts-app-name">{{LABEL}}</div>
      <div class="ts-new-chat">new chat</div>
    </div>

    <!-- Body: user avatar and the typed bubble -->
    <div class="ts-body">
      <div class="ts-user-row">
        <div class="ts-avatar">@</div>
        <div class="ts-username">you</div>
      </div>
      <div class="ts-bubble" id="ts-bubble">
        <span id="ts-typed"></span><span class="ts-cursor" id="ts-cursor">&#9611;</span>
      </div>
    </div>
  </div>

  <!-- Bottom tag (hidden when blank) -->
  <div class="ts-bottom-tag" id="ts-bottom-tag" style="{{BOTTOM_TAG_DISPLAY}}">{{BOTTOM_TAG}}</div>

  <script src="gsap.min.js"></script>
  <script>
  (function () {
    window.__timelines = window.__timelines || {};

    /* Values from the filler. Numbers and the variant are validated. The prompt is a
       JSON string with < > & { } written as \\u escapes, so it is exactly the typed text. */
    var DURATION     = parseFloat("{{DURATION}}");
    var TYPING_SPEED = parseFloat("{{TYPING_SPEED}}");
    var PROMPT_TEXT  = "{{PROMPT}}";
    var VARIANT      = "{{VARIANT}}";

    var comp = document.querySelector('#typing-scene-root');
    if (VARIANT === "pip-safe" && comp) comp.classList.add("ts-pip-safe");

    var tagEl = document.getElementById("ts-bottom-tag");
    var hasTag = !!tagEl && tagEl.textContent.trim() !== "";
    if (tagEl && !hasTag) tagEl.style.display = "none";

    /* Typing counter. A plain object is tweened and read at each tick, so the
       result is the same on every render. */
    var proxy = { n: 0 };
    var typedEl = document.getElementById("ts-typed");
    function updateTyped() {
      if (!typedEl) return;
      typedEl.textContent = PROMPT_TEXT.slice(0, Math.round(proxy.n));
    }

    var tl = gsap.timeline({ paused: true });

    tl.fromTo("#ts-card", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
    tl.fromTo("#ts-label", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.05);
    tl.fromTo("#ts-glow", { scale: 0.85, opacity: 0 }, { scale: 1.0, opacity: 1, duration: 0.8, ease: "power2.out" }, 0);

    /* Typing starts at 0.5 s. The whole prompt stays on screen for TYPING_HOLD
       seconds before the clip ends, whatever the length or speed. A clip too short
       to type in shows the whole prompt at once, never a half-typed line at the cut. */
    var TYPING_HOLD = 0.6;
    function typingWindow(duration, speed) {
      if (!(speed > 0)) speed = 1.0;
      if (!(duration > 0)) return { start: 0, end: 0 };
      var latest = Math.max(0, duration - TYPING_HOLD);
      var start = Math.min(0.5, latest / 2);
      var end = Math.max(start + 0.5, duration * 0.88 / speed);
      end = Math.min(end, latest);
      if (end < start) end = start;
      return { start: start, end: end };
    }
    var win = typingWindow(DURATION, TYPING_SPEED);

    tl.to(proxy, { n: PROMPT_TEXT.length, duration: win.end - win.start, ease: "none", onUpdate: updateTyped }, win.start);

    /* Cursor blink for the whole clip. */
    var blinkPeriod = 0.35;
    var blinkCycles = Math.ceil(DURATION / blinkPeriod) - 1;
    tl.to("#ts-cursor", { opacity: 0, duration: blinkPeriod, ease: "steps(1)", repeat: blinkCycles, yoyo: true }, 0.5);

    if (hasTag) tl.fromTo("#ts-bottom-tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.7);

    window.__timelines["typing-scene"] = tl;
  })();
  </script>
</div>
</template>
